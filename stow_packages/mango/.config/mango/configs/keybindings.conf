# --- keybindings ---
# -------------------

# NOTE: comments with "[desc]" are parsed by a script to show keybindings in
#       dmenu or similar menu program;
#       "|" are used as separator

# applications (super + alt)
# --------------------------
#
# [desc] | super + alt + f | open tui file manager (yazi)
binds = SUPER + ALT, f, spawn, kitty yazi

# [desc] | super + alt + t | open file manager (thunar)
binds = SUPER + ALT, t, spawn, thunar

# [desc] | super + alt + b | open browser (firefox)
binds = SUPER + ALT, b, spawn, firefox

# [desc] | super + alt + e | open email client (thunderbird)
binds = SUPER + ALT, e, spawn, thunderbird

# [desc] | super + alt + m | open messenger (telegram)
binds = SUPER + ALT, m, spawn, Telegram

# [desc] | super + alt + v | open code editor (neovim)
binds = SUPER + ALT, v, spawn, neovide


# special keys (including fn)
# ---------------------------
#
# [desc] | f1 | decrease brightness
bindls = NONE, F1, spawn, brightnessctl --class=backlight set 2%-
bindls = NONE, XF86MonBrightnessDown, spawn, brightnessctl --class=backlight set 2%-

# [desc] | f2 | increase brightness
bindls = NONE, F2, spawn, brightnessctl --class=backlight set +2%
bindls = NONE, XF86MonBrightnessUp, spawn, brightnessctl --class=backlight set +2%

# [desc] | f3 | decrease volume (system)
binds = NONE, F3, spawn, pulsemixer --change-volume -5 --max-volume 100
binds = NONE, XF86AudioLowerVolume, spawn, pulsemixer --change-volume -5 --max-volume 100

# [desc] | f4 | increase volume (system)
binds = NONE, F4, spawn, pulsemixer --change-volume +5 --max-volume 100
binds = NONE, XF86AudioRaiseVolume, spawn, pulsemixer --change-volume +5 --max-volume 100

# [desc] | f5 | mute volume (system)
binds = NONE, F5, spawn, pulsemixer --toggle-mute
binds = NONE, XF86AudioMute, spawn, pulsemixer --toggle-mute

# [desc] | f6 | toggle media play/pause
binds = NONE, F6, spawn, playerctl play-pause
binds = NONE, XF86AudioMute, spawn, playerctl play-pause

# [desc] | media previous | play previous media
binds = NONE, XF86AudioPrevious, spawn, playerctl previous

# [desc] | media next | play next media
binds = NONE, XF86AudioNext, spawn, playerctl next


# [desc] | print-screen | take fullscreen screenshot
binds = NONE, Print, spawn_shell, ~/.bin/screenshot_wayland

# [desc] | alt + print-screen | take fullscreen screenshot after 5 sec
binds = ALT, Print, spawn_shell, sleep 5 && ~/.bin/screenshot_wayland

# [desc] | super + print-screen | take screenshot and annotate
binds = SUPER, Print, spawn_shell, ~/.bin/screenshot_wayland --annotate

# [desc] | super + print-screen | take screenshot of selected region
binds = SUPER + SHIFT, Print, spawn_shell, ~/.bin/screenshot_wayland --region

# lock the screen on laptop lid close
switchbind = fold, spawn, hyprlock


# primary shortcuts (super / super + shift)
# -----------------------------------------
#
# [desc] | super + enter | open terminal (kitty)
binds = SUPER, Return, spawn, kitty

# [desc] | super + d | open application launcher (menu)
binds = SUPER, d, spawn_shell, fuzzel -p "applications: "

# [desc] | super + h | open clipboard (menu)
binds = SUPER, h, spawn_shell, ~/.bin/menu_agnostic__utilities/utilities.py clipboard -m fuzzel -d wayland

# [desc] | super + l | lock the screen (hyprlock)
binds = SUPER, l, spawn, hyprlock

# [desc] | super + n | open network-manager (menu)
binds = SUPER, n, spawn, networkmanager_dmenu

# [desc] | super + t | open colorscheme picker (menu)
binds = SUPER, t, spawn_shell, ~/.bin/menu_agnostic__utilities/utilities.py colorscheme_switcher -m fuzzel -w hyprland

# [desc] | super + x | open powermenu (menu)
binds = SUPER, x, spawn_shell, ~/.bin/menu_agnostic__utilities/utilities.py powermenu -m fuzzel -w hyprland

# [desc] | super + shift + b | open bookmark manager (menu, bkmr)
binds = SUPER + SHIFT, b, spawn_shell, ~/.bin/menu_agnostic__utilities/utilities.py bookmark_manager -m fuzzel -b bkmr --online-status offline

# [desc] | super + shift + c | open calculator (qalculate)
binds = SUPER + SHIFT, c, spawn, qalculate-gtk

# [desc] | super + shift + h | open task manager (btop)
binds = SUPER + SHIFT, h, spawn, kitty btop

# [desc] | super + shift + z | open notes manager (menu, zk)
binds = SUPER + SHIFT, z, spawn_shell, ~/.bin/menu_agnostic__utilities/utilities.py zk -m fuzzel -t kitty


# [desc] | super + c | close focused window/client
binds = SUPER, c, killclient,

# [desc] | super + shift + q | quit compositor
binds = SUPER + SHIFT, q, quit

# [desc] | super + shift + r | reload compositor
binds = SUPER + SHIFT, r, reload_config


# [desc] | super + a | cycle (anti-clockwise) window/client focus on current tag
binds = SUPER, a, focusdir, left

# [desc] | super + o | cycle (downward) window/client focus on current tag
binds = SUPER, o, focusdir, down

# [desc] | super + e | cycle (upward) window/client focus on current tag
binds = SUPER, e, focusdir, up

# [desc] | super + u | cycle (clockwise) window/client focus on current tag
binds = SUPER, u, focusdir, right

# [desc] | super + mouse left click | drag around window/client
mousebind = SUPER, btn_left, moveresize, curmove


# [desc] | super + shift + a | move (backward) window/client on current tag
binds = SUPER + SHIFT, a, exchange_client, left

# [desc] | super + shift + o | move (downward) window/client on current tag
binds = SUPER + SHIFT, o, exchange_client, down

# [desc] | super + shift + e | move (upward) window/client on current tag
binds = SUPER + SHIFT, e, exchange_client, up

# [desc] | super + shift + u | move (forward) window/client on current tag
binds = SUPER + SHIFT, u, exchange_client, right


# [desc] | super + comma (,) | move (backward) through active tags
binds = SUPER, comma, viewtoleft_have_client, 0

# [desc] | super + period (.) | move (forward) through active tags
binds = SUPER, period, viewtoright_have_client, 0

# [desc] | super + backspace | return to previous tag

# [desc] | super + tab | toggle tag overview
binds = SUPER, Tab, toggleoverview,

# NONE mode key only work in overview mode
mousebind = NONE, btn_left, toggleoverview, -1

# 4 finger swipe to switch tag
gesturebind = NONE, up, 4, toggleoverview
gesturebind = NONE, down, 4, toggleoverview

# [desc] | super + g | pin focused window/client
binds = SUPER, g, toggleglobal,


# [desc] | super + minus (-) | decrease window/client width
binds = SUPER, minus, resizewin, -100,0

# [desc] | super + shift + minus (-) | decrease window/client height
binds = SUPER + SHIFT, underscore, resizewin, 0,-100

# [desc] | super + equal (=) | increase window/client width
binds = SUPER, equal, resizewin, 100,0

# [desc] | super + shift + equal (=) | increase window/client height
binds = SUPER + SHIFT, plus, resizewin, 0,100

# [desc] | super + mouse right click | resize window/client
mousebind = SUPER, btn_right, moveresize, curresize


# [desc] | super + left bracket ([) | cycle through width presets of focused window/client
binds = SUPER, bracketleft, switch_proportion_preset,


# [desc] | super + f | toggle fullscreen state of focused window/client
binds = SUPER, f, togglefullscreen,

# [desc] | super + shift + f | toggle windowed-fullscreen state of focused window/client
binds = SUPER + SHIFT, f, togglefakefullscreen,

# [desc] | super + m | toggle maximized layout
# binds = SUPER, m, togglemaxmizescreen,
binds = SUPER, m, set_proportion, 1.0

# [desc] | super + shift + m | center focused window/client
binds = SUPER + SHIFT, m, centerwin

# [desc] | super + bracketright (]) | cycle through layouts
binds = SUPER, bracketright, switch_layout

# [desc] | super + backslash (\) | toggle floating state of focused window/client
binds = SUPER, backslash, togglefloating

# [desc] | super + i | minimize focused window/client
binds = SUPER, i, minimized,

# [desc] | super + shift + i | restore minimized window/client
binds = SUPER+SHIFT, i, restore_minimized


# [desc] | super + s | toggle scratchpad
binds = SUPER, s, toggle_scratchpad

# switch tags
# [desc] | super + [1-9] | move to corresponding tag
bind = SUPER, 1, view, 1
bind = SUPER, 2, view, 2
bind = SUPER, 3, view, 3
bind = SUPER, 4, view, 4
bind = SUPER, 5, view, 5
bind = SUPER, 6, view, 6
bind = SUPER, 7, view, 7
bind = SUPER, 8, view, 8
bind = SUPER, 9, view, 9

# move focused window/client to a tag
# [desc] | super + shift + [1-9] | move focused window to corresponding tag
bind = SUPER + SHIFT, 1, tag, 1
bind = SUPER + SHIFT, 2, tag, 2
bind = SUPER + SHIFT, 3, tag, 3
bind = SUPER + SHIFT, 4, tag, 4
bind = SUPER + SHIFT, 5, tag, 5
bind = SUPER + SHIFT, 6, tag, 6
bind = SUPER + SHIFT, 7, tag, 7
bind = SUPER + SHIFT, 8, tag, 8
bind = SUPER + SHIFT, 9, tag, 9

# 3 finger swipe to move tag
gesturebind = NONE, left, 3, viewtoleft, 0
gesturebind = NONE, right, 3, viewtoright, 0
gesturebind = NONE, up, 3, viewtoleft, 0
gesturebind = NONE, down, 3, viewtoright, 0


## other programs or scripts (super + ctrl)
## ----------------------------------------
#
# [desc] | super + ctrl + e | open emoji picker (menu)
binds = SUPER + CTRL, e, spawn_shell, BEMOJI_PICKER_CMD="fuzzel -d -p emoji: " bemoji

# [desc] | super + ctrl + g | open color picker (hyprpicker)
binds = SUPER + CTRL, g, spawn, hyprpicker -a

# [desc] | super + ctrl + b | use low preset for bluelight filter (sunsetr)
binds = SUPER + CTRL, b, spawn, sunsetr preset low

# [desc] | super + ctrl + shift + b | turn off bluelight filter (sunsetr)
binds = SUPER + CTRL + SHIFT, b, spawn, sunsetr stop

# [desc] | super + ctrl + p | take screenshot of a selected region
binds = SUPER + CTRL, p, spawn_shell, ~/.bin/screenshot_wayland --region

# [desc] | super + ctrl + shift + p | take screenshot and annotate
binds = SUPER + CTRL + SHIFT, p, spawn_shell, ~/.bin/screenshot_wayland --annotate
