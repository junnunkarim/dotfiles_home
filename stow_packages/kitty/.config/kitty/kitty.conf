include ~/.config/kitty/colorschemes/rose_pine.conf

font_family         family="Iosevka Slab" postscript_name=Iosevka-Slab
bold_font           auto
italic_font         auto
bold_italic_font    auto

# nerd fonts
symbol_map
\U+e000-U+e00a,
\U+ea60-U+ebeb,
\U+e0a0-U+e0c8,
\U+e0ca,
\U+e0cc-U+e0d7,
\U+e200-U+e2a9,
\U+e300-U+e3e3,
\U+e5fa-U+e6b7,
\U+e700-U+e8ef,
\U+ed00-U+efc1,
\U+f000-U+f2ff,
\U+f000-U+f2e0,
\U+f300-U+f381,
\U+f400-U+f533,
\U+f0001-U+f1af0
\Symbols Nerd Font Mono

font_size                       18

window_padding_width            16
confirm_os_window_close         2

# increases scroll speed
touch_scroll_multiplier         3.0
