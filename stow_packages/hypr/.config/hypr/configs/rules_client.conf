# --- window/client and workspace rules ---
# -----------------------------------------

# wiki: https://wiki.hyprland.org/Configuring/Window-Rules/
# wiki: https://wiki.hyprland.org/Configuring/Workspace-Rules/

windowrule = workspace 1, match:class (.*)(konsole)$
windowrule = workspace 1, match:class kitty

windowrule = workspace 2, match:class (code-oss)
windowrule = workspace 2, match:class (Geany)
windowrule = workspace 2, match:class (jetbrains-idea-ce)
windowrule = workspace 2, match:class (jetbrains-pycharm)
windowrule = workspace 2, match:class (jetbrains-dataspell)
windowrule = workspace 2, match:class (neovide)
windowrule = workspace 2, match:class (.*)(obsidian)(.*)$

windowrule = workspace 3, match:class (thunar)
windowrule = workspace 3, match:class (Thunar)
windowrule = workspace 3, match:class (Pcmanfm)
windowrule = workspace 3, match:class (.*)(konsole), match:title (.*)(yazi)(.*)$
windowrule = workspace 3, match:class (.*)(konsole), match:title (fx)(.*)(Konsole)$
windowrule = workspace 3, match:class (.*)(qbittorrent)(.*)$

windowrule = workspace 4, match:class (.*)(chromium)$
windowrule = workspace 4, match:class (Chromium)
windowrule = workspace 4, match:class (firefox)(.*)$
windowrule = workspace 4, match:class (Nyxt)
windowrule = workspace 4, match:class (Vieb)

windowrule = workspace 5, match:class (FreeTube)
windowrule = workspace 5, match:class (Gimp)
windowrule = workspace 5, match:class (gimp)(.*)$
windowrule = workspace 5, match:class (mpv)
windowrule = workspace 5, match:class (.*)(obsproject)(.*)$
windowrule = workspace 5, match:class (vlc)

windowrule = workspace 6, match:class (calibre)
windowrule = workspace 6, match:class (DesktopEditors)
windowrule = workspace 6, match:class (KOReader)
windowrule = workspace 6, match:class (okular)
windowrule = workspace 6, match:class (sioyek)
windowrule = workspace 6, match:class (.*)(zathura)(.*)$
windowrule = workspace 6, match:class (Zeal)

windowrule = workspace 7, match:class (Session)
windowrule = workspace 7, match:class (.*)(telegram)(.*)$
windowrule = workspace 7, match:class (.*)(Telegram)(.*)$
windowrule = workspace 7, match:class (vesktop)

# windowrule = workspace 8, match:class (retroarch)
# windowrule = workspace 8, match:class (Ryujinx)
# windowrule = workspace 8, match:class (yuzu)

windowrule = workspace 8, match:class (GParted)
windowrule = workspace 8, match:class (Lxappearance)
windowrule = workspace 8, match:class (nwg-look)
windowrule = workspace 8, match:class (virt-manager)
windowrule = workspace 8, match:class (Xfce4-power-manager-settings)

windowrule = workspace 9, match:class (dolphin-emu)
windowrule = workspace 9, match:title (.*)(Terraria)(.*)$

# open emacs in scratchpad
windowrule = workspace special:scratch, match:class (Emacs)
# open zed in scratchpad
windowrule = workspace special:scratch, match:class (.*)(zed)(.*)$
# open any Quran app in scratchpad
windowrule = workspace special:scratch, match:class (.*)(quran)(.*)$

windowrule = float on, match:class (engrampa)
windowrule = float on, match:class (nm-connection-editor)
windowrule = float on, match:class (nwg-look)
windowrule = float on, match:class (org.gnome.Calendar)
windowrule = float on, match:class (org.gnome.clocks)
windowrule = float on, match:class (pop_)(.*)$
windowrule = float on, match:class (Protonvpn)
windowrule = float on, match:class (Xdg-desktop-portal)(.*)$
windowrule = float on, match:title (.*)(Choose Files)(.*)$
windowrule = float on, match:title (.*)(Iced)(.*)$
windowrule = float on, match:class (thunar), match:title (Rename)(.*)$

windowrule = float on, match:class (.*)(scratch_task)(.*)$
windowrule = center on, match:class (.*)(scratch_task)(.*)$
windowrule = size (monitor_w * 0.8) (monitor_h * 0.8), match:class (.*)(scratch_task)(.*)$

windowrule = float on, match:class (.*)(KeePassXC)(.*)$
windowrule = center on, match:class (.*)(KeePassXC)(.*)$
windowrule = size (monitor_w * 0.8) (monitor_h * 0.8), match:class (.*)(KeePassXC)(.*)$

windowrule = size <80% <90%, match:class (dolphin-emu)
windowrule = size 50% 30%, match:class (engrampa)
windowrule = size 60% 70%, match:class (nm-connection-editor)
windowrule = size 70% 70%, match:class (nwg-look)
windowrule = size 70% 80%, match:class (org.gnome.Calendar)
windowrule = size 80% 80%, match:class (pop_)(.*)$
windowrule = size 50% 40%, match:class (thunar), match:title (Rename)(.*)$

windowrule = no_anim on, match:class (CoreKeeper)
windowrule = no_anim on, match:class (dolphin-emu)
windowrule = no_anim on, match:title (.*)(Terraria)(.*)$
windowrule = no_anim on, match:class ^(virt-manager)$

windowrule = no_blur on, match:class (CoreKeeper)
windowrule = no_blur on, match:class (dolphin-emu)
windowrule = no_blur on, match:class (FreeTube)
windowrule = no_blur on, match:title (.*)(Terraria)(.*)$
windowrule = no_blur on, match:class ^(virt-manager)$

# context menu
windowrule = no_blur   on, match:class ^()$,  match:title ^()$
windowrule = no_dim    on, match:class ^()$,  match:title ^()$
windowrule = no_shadow on, match:class ^()$,  match:title ^()$
windowrule = opacity  1.0, match:class ^()$,  match:title ^()$
windowrule = opacity  1.0, match:modal yes

windowrule = no_dim on, match:class ^(virt-manager)$

windowrule = opacity 1 override,  match:class (CoreKeeper)
windowrule = opacity 1 override,  match:class (dolphin-emu)
windowrule = opacity 1 override,  match:class (FreeTube)
windowrule = opacity 1 override,  match:class (gimp)(.*)$
windowrule = opacity 1 override,  match:class (mpv)$
windowrule = opacity 1 override,  match:class (.*)(qView)(.*)$
windowrule = opacity 1 override,  match:title (.*)(Terraria)(.*)$
windowrule = opacity 1 override,  match:class ^(virt-manager)$
