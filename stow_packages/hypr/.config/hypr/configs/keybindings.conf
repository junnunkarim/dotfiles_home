# --- keybindings ---
# -------------------

# NOTE: comments with "[desc]" are parsed by a script to show keybindings in
#       dmenu or similar menu program;
#       "|" are used as separator

# vars
# ----
#
# utility apps
$terminal = kitty
$file_manager = thunar
$file_manager_tui = kitty yazi
$fuzzel_run = fuzzel -p "applications: "

# common apps
$app_browser = firefox
$app_email = thunderbird
$app_message = Telegram
$app_editor = kitty nvim

# screenshot
$notify_ss = hyprctl notify 5 3000 0 fontsize:25 "Screenshot Taken!"
$ss_full = ~/.bin/screenshot_wayland && $notify_ss
$ss_full_delay = sleep 5 & ~/.bin/screenshot_wayland && $notify_ss
$ss_anno = ~/.bin/screenshot_wayland --annotate && $notify_ss
$ss_region = ~/.bin/screenshot_wayland --region && $notify_ss

# dmenu/any other menu
$menu_zk = ~/.bin/menu_agnostic__utilities/utilities.py zk -m fuzzel -t $terminal
$menu_bk = ~/.bin/menu_agnostic__utilities/utilities.py bookmark_manager -m fuzzel -b bkmr --online-status offline
$menu_powermenu = ~/.bin/menu_agnostic__utilities/utilities.py powermenu -m fuzzel -w hyprland
$menu_keybindings = ~/.bin/menu_agnostic__utilities/utilities.py show_keybindings -m fuzzel -w hyprland
$menu_clipboard = ~/.bin/menu_agnostic__utilities/utilities.py clipboard -m fuzzel -d wayland
$menu_switch_colorscheme = ~/.bin/menu_agnostic__utilities/utilities.py colorscheme_switcher -m fuzzel -w hyprland
$menu_emoji = BEMOJI_PICKER_CMD="fuzzel -d -p Emoji:" bemoji
$menu_manage_clients = ~/.bin/menu_agnostic__utilities/utilities.py manage_clients -m fuzzel -w hyprland

# scratchpads
$scratch_term = ~/.config/hypr/scripts/scratchpad_toggle.py -p "kitty --class scratch_term" -r "float; size 80% 80%; center" -m "scratch_term" -s "scratch_term"
$scratch_task = ~/.config/hypr/scripts/scratchpad_toggle.py -p "kitty --class scratch_task btop" -r "float; size 80% 90%; center" -m "scratch_task" -s "scratch_task"
$scratch_pass = ~/.config/hypr/scripts/scratchpad_toggle.py -p "keepassxc" -r "float; size 80% 80%; center" -m "keepassxc" -s "scratch_pass"
$scratch_calc = ~/.config/hypr/scripts/scratchpad_toggle.py -p "qalculate-gtk" -r "float; size 80% 90%; center" -m "qalculate-gtk" -s "scratch_calc"

# scripts
$disable_all_decorations = ~/.config/hypr/scripts/disable_decorations.py --all
$disable_anim_blur = ~/.config/hypr/scripts/disable_decorations.py --anim_blur

# keys
# ----
#
## applications (super + alt)
## --------------------------
#
# [desc] | super + alt + f | open tui file manager (yazi)
bind = SUPER ALT, F, exec, $file_manager_tui

# [desc] | super + alt + t | open file manager (thunar)
bind = SUPER ALT, T, exec, $file_manager

# [desc] | super + alt + b | open browser (firefox)
bind = SUPER ALT, B, exec, $app_browser

# [desc] | super + alt + e | open email client (thunderbird)
bind = SUPER ALT, E, exec, $app_email

# [desc] | super + alt + m | open messenger (telegram)
bind = SUPER ALT, M, exec, $app_message

# [desc] | super + alt + v | open code editor (neovim)
bind = SUPER ALT, V, exec, $app_editor

## special keys (including fn)
## ---------------------------
#
# [desc] | f1 | decrease brightness
bind = , F1, exec, brightnessctl set 2%-
bind = , XF86MonBrightnessDown, exec, brightnessctl set 2%-

# [desc] | f2 | increase brightness
bind = , F2, exec, brightnessctl set +2%
bind = , XF86MonBrightnessUp, exec, brightnessctl set +2%

# [desc] | f3 | decrease volume (system)
bind = , F3, exec, pulsemixer --change-volume -5 --max-volume 100
bind = , XF86AudioLowerVolume, exec, pulsemixer --change-volume -5 --max-volume 100

# [desc] | f4 | increase volume (system)
bind = , F4, exec, pulsemixer --change-volume +5 --max-volume 100
bind = , XF86AudioRaiseVolume, exec, pulsemixer --change-volume +5 --max-volume 100

# [desc] | f5 | mute volume (system)
bind = , F5, exec, pulsemixer --toggle-mute
bind = , XF86AudioMute, exec, pulsemixer --toggle-mute

# [desc] | f6 | toggle media play/pause
bind = , F6, exec, playerctl play-pause
bind = , XF86AudioPlay, exec, playerctl play-pause

# [desc] | media previous | play previous media
bind = , XF86AudioPrevious, exec, playerctl previous

# [desc] | media next | play next media
bind = , XF86AudioNext, exec, playerctl next

# [desc] | print-screen | take fullscreen screenshot
bind = , Print, exec, $ss_full

# [desc] | super + f12 | take fullscreen screenshot
bind = SUPER, F12, exec, $ss_full

# [desc] | alt + print-screen | take fullscreen screenshot after 5 sec
bind = ALT, Print, exec, $ss_full_delay

# [desc] | super + print-screen | take screenshot and annotate
bind = SUPER, Print, exec, $ss_anno

# [desc] | super + print-screen | take screenshot of selected region
bind = SUPER SHIFT, Print, exec, $ss_region

# lock the screen on laptop lid close
bindl = , switch:Lid Switch, exec, hyprlock

## primary shortcuts (super / super + shift)
## -----------------------------------------
#
# [desc] | super + enter | open terminal (kitty)
bind = SUPER, Return, exec, $terminal

# [desc] | super + d | open application launcher (menu)
bind = SUPER, D, exec, $fuzzel_run

# [desc] | super + h | open clipboard (menu)
bind = SUPER, H, exec, $menu_clipboard

# [desc] | super + l | lock the screen (hyprlock)
bind = SUPER, L, exec, hyprlock

# [desc] | super + k | show all keybindings (menu)
bind = SUPER, K, exec, $menu_keybindings

# [desc] | super + n | open network-manager (menu)
bind = SUPER, N, exec, networkmanager_dmenu

# [desc] | super + t | open colorscheme picker (menu)
bind = SUPER, T, exec, $menu_switch_colorscheme

# [desc] | super + w | open client manager (menu)
bind = SUPER, W, exec, $menu_manage_clients

# [desc] | super + x | open powermenu (menu)
bind = SUPER, X, exec, $menu_powermenu

# [desc] | super + shift + b | open bookmark manager (menu, bkmr)
bind = SUPER SHIFT, B, exec, $menu_bk

# [desc] | super + shift + z | open notes manager (menu, zk)
bind = SUPER SHIFT, Z, exec, $menu_zk


# [desc] | super + c | close focused window/client
bind = SUPER, C, killactive,

# [desc] | super + shift + q | quit compositor
bind = SUPER SHIFT, Q, exit,

# [desc] | super + shift + r | reload compositor
bind = SUPER SHIFT, R, exec, hyprctl reload

# [desc] | super + b | toggle bar on/off
# bind = SUPER, B, exec, agsv1 --toggle-window "bar-0"


# [desc] | super + a | cycle (anti-clockwise) window/client focus on current workspace
bind = SUPER, A, cyclenext, prev

# [desc] | super + u | cycle (clockwise) window/client focus on current workspace
bind = SUPER, U, cyclenext

# [desc] | super + shift + a | move (anti-clockwise) focused window/client on current workspace
bind = SUPER SHIFT, A, layoutmsg, swapprev

# [desc] | super + shift + u | move (clockwise) focused window/client on current workspace
bind = SUPER SHIFT, U, layoutmsg, swapnext

# [desc] | super + mouse left click | drag around window/client
bindm = SUPER, mouse:272, movewindow


# [desc] | super + comma (,) | move (backward) through active workspaces
bind = SUPER, comma, workspace, m-1

# [desc] | super + mouse scroll down | move (backward) through active workspaces
bind = SUPER, mouse_down, workspace, m-1

# [desc] | super + period (.) | move (forward) through active workspaces
bind = SUPER, period, workspace, m+1

# [desc] | super + mouse scroll up | move (forward) through active workspaces
bind = SUPER, mouse_up, workspace, m+1

# [desc] | super + backspace | return to previous workspace
bind = SUPER, BackSpace, workspace, previous


# [desc] | super + minus (-) | decrease window/client width
bind = SUPER, minus, resizeactive, -100 0

# [desc] | super + shift + minus (-) | decrease window/client height
bind = SUPER SHIFT, minus, resizeactive, 0 -100

# [desc] | super + equal (=) | increase window/client width
bind = SUPER, equal, resizeactive, 100 0

# [desc] | super + shift + equal (=) | increase window/client height
bind = SUPER SHIFT, equal, resizeactive, 0 100

# [desc] | super + mouse right click | resize window/client
bindm = SUPER, mouse:273, resizewindow


# [desc] | super + f | toggle fullscreen state of focused window/client
bind = SUPER, F, fullscreen

# [desc] | super + shift + f | toggle windowed-fullscreen state of focused window/client
bind = SUPER SHIFT, F, fullscreenstate, 0 2

# [desc] | super + m | toggle maximized layout
bind = SUPER, M, fullscreen, 1

# [desc] | super + bracketright (]) | cycle through master layout orientations
bind = SUPER, bracketright, exec, hyprctl dispatch layoutmsg orientationnext

# [desc] | super + backslash (\) | toggle floating state of focused window/client
bind = SUPER, backslash, togglefloating,

# [desc] | super + shift + backslash (\) | center floating window/client
bind = SUPER SHIFT, backslash, centerwindow, 1


# [desc] | super + s | toggle scratchpad
bind = SUPER, S, togglespecialworkspace, scratch

# [desc] | super + shift + s | move focused window/client to scratchpad
bind = SUPER SHIFT, S, movetoworkspace, special:scratch

# [desc] | super + shift + enter | toggle terminal scratchpad
bind = SUPER SHIFT, Return, exec, $scratch_term

# [desc] | super + shift + h | toggle task manager scratchpad
bind = SUPER SHIFT, H, exec, $scratch_task

# [desc] | super + shift + backspace | toggle password-manager scratchpad
bind = SUPER SHIFT, BackSpace, exec, $scratch_pass

# [desc] | super + shift + c | toggle calculator scratchpad
bind = SUPER SHIFT, C, exec, $scratch_calc

# [desc] | super + shift + i | toggle minimize scratchpad
bind = SUPER SHIFT, I, togglespecialworkspace, s_minimize

# [desc] | super + i | put window/client in minimize scratchpad
bind = SUPER, I, movetoworkspacesilent, special:s_minimize
bind = SUPER, I, exec, hyprctl notify 2 3000 0 fontsize:25 Minimized Window


# switch workspaces
# [desc] | super + [1-9] | move to corresponding tag
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

# move focused window/client to a workspace
# [desc] | super + shift + [1-9] | move focused window to corresponding tag
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

## other programs or scripts (super + ctrl)
## ----------------------------------------
#
# [desc] | super + ctrl + minus (-) | zoom in display to 100% (magnifier)
bind = SUPER CTRL, minus, exec, hyprctl keyword cursor:zoom_factor 1.0

# [desc] | super + ctrl + equal (=) | zoom in display to 150% (magnifier)
bind = SUPER CTRL, equal, exec, hyprctl keyword cursor:zoom_factor 1.5 && hyprctl notify 1 5000 0 fontsize:25 Zoomed-in to 150%


# [desc] | super + ctrl + e | open emoji picker (menu)
bind = SUPER CTRL, E, exec, $menu_emoji

# [desc] | super + ctrl + g | open color picker (hyprpicker)
bind = SUPER CTRL, G, exec, hyprpicker -a


# [desc] | super + ctrl + b | use low preset for bluelight filter (sunsetr)
bind = SUPER CTRL, B, exec, sunsetr preset low

# [desc] | super + ctrl + shift + b | turn off bluelight filter (sunsetr)
bind = SUPER CTRL SHIFT, B, exec, sunsetr stop


# [desc] | super + ctrl + p | take screenshot of a selected region
bind = SUPER CTRL, P, exec, $ss_region

# [desc] | super + ctrl + shift + p | take screenshot and annotate
bind = SUPER CTRL SHIFT, P, exec, $ss_anno


# [desc] | super + ctrl + d | disable animations and blur
bind = SUPER CTRL, D, exec, $disable_anim_blur

# [desc] | super + shift + ctrl + d | disable all styles
bind = SUPER SHIFT CTRL, D, exec, $disable_all_decorations
