#---------------------------------//
#---------- keybindings ----------//
#---------------------------------//

# See https://wiki.hyprland.org/Configuring/Keywords/


# variables
# ---------
#
# utility apps
$terminal = kitty
$file_manager = thunar
$file_manager_cli = konsole -e yazi
$fuzzel_run = fuzzel -p "Applications: "

# common apps
$app_browser_main = firefox-nightly
$app_message = Telegram
$app_editor_gui = neovide

# screenshot
$notify_ss = hyprctl notify 5 3000 0 fontsize:25 "Screenshot Taken!"
$ss_full = grimblast --freeze save screen && $notify_ss
$ss_full_5_sec = grimblast --freeze --wait 5 save screen && $notify_ss
$ss_area = grimblast --freeze save area && $notify_ss

# dmenu/any other menu
$menu_zk = ~/.bin/menu_agnostic__utilities/utilities.py zk -m fuzzel -t $terminal
$menu_bk = ~/.bin/menu_agnostic__utilities/utilities.py bookmark_manager -m fuzzel -b bkmr --online-status offline
$menu_powermenu = ~/.bin/menu_agnostic__utilities/utilities.py powermenu -m fuzzel -w hyprland
$menu_keybindings = ~/.bin/menu_agnostic__utilities/utilities.py show_keybindings -m fuzzel -w hyprland
$menu_clipboard = ~/.bin/menu_agnostic__utilities/utilities.py clipboard -m fuzzel -d wayland
$menu_switch_colorscheme = ~/.bin/menu_agnostic__utilities/utilities.py colorscheme_switcher -m fuzzel -w hyprland
$menu_emoji = BEMOJI_PICKER_CMD="fuzzel -d -p Emoji:" bemoji
$menu_manage_clients = ~/.bin/menu_agnostic__utilities/utilities.py manage_clients -m fuzzel -w hyprland

# scratchpads
$s_term = ~/.config/hypr/scripts/scratchpad_toggle.py -p "kitty --class s_term" -r "float; size 80% 80%; center" -m "s_term" -s "s_term"
$s_top = ~/.config/hypr/scripts/scratchpad_toggle.py -p "kitty --class s_top btop" -r "float; size 80% 90%; center" -m "s_top" -s "s_top"
$s_pass = ~/.config/hypr/scripts/scratchpad_toggle.py -p "keepassxc" -r "float; size 80% 80%; center" -m "keepassxc" -s "s_pass"
$s_calc = ~/.config/hypr/scripts/scratchpad_toggle.py -p "qalculate-gtk" -r "float; size 80% 90%; center" -m "qalculate-gtk" -s "s_calc"

# scripts
$disable_all_decorations = ~/.config/hypr/scripts/disable_decorations.py --all
$disable_anim_blur = ~/.config/hypr/scripts/disable_decorations.py --anim_blur

# keys
# ----
#
# sets "Windows" key as main modifier
$mod = SUPER

# [NOTE]: comments with '#desc' are parsed by a script to show keybindings in
# dmenu or similar menu program

# other programs or scripts (super + ctrl)
# ----------------------------------------
#
#desc: super + ctrl + r | enable bluelight filter (low)
bind = $mod CTRL, R, exec, hyprctl hyprsunset temperature 4000
#desc: super + ctrl + l | enable bluelight filter (normal)
bind = $mod CTRL, L, exec, hyprctl hyprsunset temperature 5000
#desc: super + ctrl + c | disable bluelight filter
bind = $mod CTRL, C, exec, hyprctl hyprsunset identity

#desc: super + ctrl + g | open color picker (gpick)
bind = $mod CTRL, G, exec, hyprpicker -a

#desc: super + ctrl + d | disable animations and blur
bind = $mod CTRL, D, exec, $disable_anim_blur
#desc: super + shift + ctrl + d | disable all styles
bind = $mod SHIFT CTRL, D, exec, $disable_all_decorations

# applications (super + alt)
# --------------------------
#
#desc: super + alt + t | open file manager (thunar)
bind = $mod ALT, T, exec, $file_manager
#desc: super + alt + f | open cli file manager (yazi)
bind = $mod ALT, F, exec, $file_manager_cli
#desc: super + alt + b | open main browser (firefox)
bind = $mod ALT, B, exec, $app_browser_main
#!desc: super + alt + e | open secondary browser (firefox)
# bind = $mod ALT, E, exec, $app_browser_secondary

#desc: super + alt + m | open message (telegram)
bind = $mod ALT, M, exec, $app_message
#desc: super + alt + v | open code editor (neovim)
bind = $mod ALT, V, exec, $app_editor_gui

#desc: print-screen | take fullscreen screenshot
bind = , Print, exec, $ss_full
#desc: super + f12 | take fullscreen screenshot
bind = $mod, F12, exec, $ss_full
#desc: super + print-screen | take screenshot of a selected area
bind = $mod, Print, exec, $ss_area
#desc: alt + print-screen | take fullscreen screenshot after 5 sec
bind = ALT, Print, exec, $ss_full_5_sec

bind = , XF86MonBrightnessDown, exec, brightnessctl s 2%-
#desc: f1 | decrease brightness
bind = , F1, exec, brightnessctl s 2%-
bind = , XF86MonBrightnessUp, exec, brightnessctl s +2%
#desc: f2 | increase brightness
bind = , F2, exec, brightnessctl s +2%

bind = , XF86AudioLowerVolume, exec, pulsemixer --change-volume -5 --max-volume 100
#desc: f3 | decrease volume (system)
bind = , F3, exec, pulsemixer --change-volume -5 --max-volume 100
bind = , XF86AudioRaiseVolume, exec, pulsemixer --change-volume +5 --max-volume 100
#desc: f4 | increase volume (system)
bind = , F4, exec, pulsemixer --change-volume +5 --max-volume 100
bind = , XF86AudioMute, exec, pulsemixer --toggle-mute
#desc: f5 | mute volume (system)
bind = , F5, exec, pulsemixer --toggle-mute

#desc: media play/pause | toggle media play/pause
bind = , XF86AudioPlay, exec, playerctl play-pause
#desc: f6 | toggle media play/pause
bind = , F6, exec, playerctl play-pause
#desc: media next | play next media
bind = , XF86AudioNext, exec, playerctl next
#desc: media previous | play previous media
bind = , XF86AudioPrevious, exec, playerctl previous

# system shortcuts (super / super + shift)
# ----------------------------------------
#
#desc: super + enter | open terminal
bind = $mod, Return, exec, $terminal
#desc: super + l | lock screen
bind = $mod, L, exec, hyprlock
# lock screen on laptop lid close
bindl=,switch:Lid Switch, exec, hyprlock
#desc: super + n | open network-manager (fuzzel)
bind = $mod, N, exec, networkmanager_dmenu

#desc: super + t | open colorscheme menu (menu)
bind = $mod, T, exec, $menu_switch_colorscheme
#desc: super + k | show all keybindings (menu)
bind = $mod, K, exec, $menu_keybindings
#desc: super + x | open powermenu (menu)
bind = $mod, X, exec, $menu_powermenu
#desc: super + d | open application launcher (fuzzel)
bind = $mod, D, exec, $fuzzel_run
#desc: super + h | open clipboard (fuzzel)
bind = $mod, H, exec, $menu_clipboard
#desc: super + e | show all emoji (menu)
bind = $mod SHIFT, S, exec, $menu_emoji
#desc: super + w | open client manager (fuzzel)
bind = $mod, W, exec, $menu_manage_clients
#desc: super + shift + b | open bookmark manager (fuzzel)
bind = $mod SHIFT, B, exec, $menu_bk
#desc: super + shift + z | open notes manager (fuzzel) (zk)
bind = $mod SHIFT, Z, exec, $menu_zk

# #desc: super + b | toggle bar on/off
# bind = $mod, B, exec, agsv1 --toggle-window "bar-0"
#desc: super + minus | decrease master split ratio
bind = $mod, minus, layoutmsg, mfact -0.1
#desc: super + equal | increase master split ratio
bind = $mod, equal, layoutmsg, mfact +0.1
#desc: super + 0 | toggle gaps on/off

# #desc: alt + tab | cycle focus through windows on current tag clockwise
# # bind = ALT, Tab, layoutmsg, cyclenext
# bind = ALT, Tab, cyclenext
# #desc: alt + backtick | cycle focus through windows on current tag anti-clockwise
# # bind = ALT, grave, layoutmsg, cycleprev
# bind = ALT, grave, cyclenext, prev

#desc: super + a | cycle focus through windows on current tag anti-clockwise
bind = $mod, A, cyclenext, prev
#desc: super + u | cycle focus through windows on current tag clockwise
bind = $mod, U, cyclenext

#desc: alt + shift + a | move focused window on current tag anti-clockwise
bind = $mod SHIFT, A, layoutmsg, swapprev
#desc: super + shift + u | move focused window on current tag clockwise
bind = $mod SHIFT, U, layoutmsg, swapnext

#desc: super + period (.) | cycle through active tags clockwise
bind = $mod, period, workspace, m+1
#desc: super + comma (,) | cycle through active tags anti-clockwise
bind = $mod, comma, workspace, m-1
#desc: super + shift + tab | go back to previous tag

bind = $mod, Tab, workspace, previous
# bind = $mod, BackSpace, workspace, previous

#desc: super + c | close focused window
bind = $mod, C, killactive,
#desc: super + shift + q | quit hyprland
bind = $mod SHIFT, Q, exit,
#desc: super + shift + r | restart hyprland
bind = $mod SHIFT, R, exec, hyprctl reload

#desc: super + f | toggle floating layout of focused window
bind = $mod, V, togglefloating,

# desc: super + shift + minus | move focused window to scratchpad space
bind = $mod SHIFT, minus, movetoworkspace, special:s_space
# desc: super + shift + s | toggle scratchpad space
bind = $mod SHIFT, W, togglespecialworkspace, s_space
# desc: super + shift + enter | toggle terminal scratchpad
bind = $mod SHIFT, Return, exec, $s_term
# desc: super + shift + enter | toggle task-manager scratchpad
bind = $mod SHIFT, H, exec, $s_top
# desc: super + shift + backspace | toggle password-manager scratchpad
bind = $mod SHIFT, BackSpace, exec, $s_pass
# desc: super + r | toggle calculator scratchpad
bind = $mod, R, exec, $s_calc
# desc: super + i | simulate minimizing client by putting it in minimize-scratchpad
bind = $mod, I, movetoworkspacesilent, special:s_minimize
bind = $mod, I, exec, hyprctl notify 2 3000 0 fontsize:25 Minimized Window
# desc: super + shift + i | toggle minimize-scratchpad
bind = $mod SHIFT, I, togglespecialworkspace, s_minimize
# bind = $mod SHIFT, I, exec, hyprctl notify 2 2000 0 fontsize:25 Scratchpad for Minimizing Clients/Windows

#desc: super + f | toggle fullscreen of focused window
bind = $mod, F, fullscreen
#desc: super + shift + f | toggle windowed-fullscreen of focused window
bind = $mod SHIFT, F, fullscreenstate, 0 2
#desc: super + m | toggle maximized layout
bind = $mod, M, fullscreen, 1
#desc: super + shift + o | cycle through layout orientations
bind = $mod SHIFT, O, exec, hyprctl dispatch layoutmsg orientationnext

#desc: super + shift + = | zoom in display to 150% (magnifier)
bind = $mod SHIFT, equal, exec, hyprctl keyword cursor:zoom_factor 1.5 && hyprctl notify 1 5000 0 fontsize:25 Zoomed-in to 150%
#desc: super + shift + / | zoom in display to 150% (magnifier)
bind = $mod SHIFT, slash, exec, hyprctl keyword cursor:zoom_factor 1.0

# Switch workspaces with mainMod + [0-9]
#desc: super + [1-9] | move to corresponding tag
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
# bind = $mod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
#desc: super + shift + [1-9] | move focused window to corresponding tag
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
# bind = $mod SHIFT, 0, movetoworkspace, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
