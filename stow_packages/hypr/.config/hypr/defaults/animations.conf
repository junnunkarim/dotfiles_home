animations {
  enabled = true

  # curves
  # source: https://m3.material.io/styles/motion/overview/specs
  bezier = emphasized, 0.2, 0, 0, 1
  bezier = emphasized_accel, 0.3, 0, 0.8, 0.15
  bezier = emphasized_decel, 0.05, 0.7, 0.1, 1

  bezier = standard_spatial, 0.27, 1.06, 0.18, 1.00
  bezier = expressive_fast_spatial, 0.42, 1.67, 0.21, 0.9
  bezier = expressive_default_spatial, 0.38, 1.21, 0.22, 1
  bezier = expressive_slow_spatial, 0.39, 1.29, 0.35, 0.98
  bezier = expressive_fast_effects, 0.31, 0.94, 0.34, 1.00
  bezier = expressive_default_effects, 0.34, 0.80, 0.34, 1.00
  bezier = expressive_slow_effects, 0.34, 0.88, 0.34, 1.00

  # animation = NAME, ONOFF, SPEED, CURVE [,STYLE]
  animation = windowsIn, 1, 5, emphasized
  animation = windowsOut, 1, 5, emphasized
  animation = windowsMove, 1, 5, emphasized

  animation = workspacesIn, 1, 5, emphasized, slidevert
  animation = workspacesOut, 1, 5, emphasized, slidevert
  animation = specialWorkspace, 1, 5, emphasized, slidefadevert

  animation = layersIn, 1, 3, emphasized_decel, slide
  animation = layersOut, 1, 4, emphasized_accel, slide
  animation = fadeLayers, 1, 5, emphasized

  animation = fade, 1, 5, emphasized
  animation = zoomFactor, 1, 6, emphasized
}
